<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Dancing!</title>
<style>
@font-face { font-family: Nunito; font-weight: 800; src: url(nunito-800.woff2) format('woff2'); }
html, body { margin: 0; height: 100%; background: #09090b; overflow: hidden; font-family: Nunito, "Segoe UI", sans-serif; }
.splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; isolation: isolate;
  background: radial-gradient(circle at 50% 45%, #2a1426 0%, #0b0a0d 62%); transition: opacity .45s ease, transform .45s ease; }
.splash.out { opacity: 0; transform: scale(1.04); }
.grid { position: absolute; inset: -40%; z-index: -1; opacity: .16;
  background-image: linear-gradient(rgba(255,102,171,.3) 1px, transparent 1px), linear-gradient(90deg, rgba(255,102,171,.3) 1px, transparent 1px);
  background-size: 52px 52px; transform: perspective(600px) rotateX(64deg) translateY(12%); animation: grid 2.3s linear both; }
@keyframes grid { from { background-position: 0 0; opacity: 0; } 35% { opacity: .18; } to { background-position: 0 104px; opacity: 0; } }
.orbit { position: absolute; width: 320px; height: 320px; display: grid; place-items: center; pointer-events: none; }
.orbit i { position: absolute; inset: 0; border: 1px solid rgba(255,120,180,.26); border-radius: 50%; animation: orbit 2.3s cubic-bezier(.2,.8,.2,1) both; }
.orbit i:nth-child(2) { inset: 26px; border-style: dashed; animation-direction: reverse; }
.orbit i:nth-child(3) { inset: 60px; border-color: rgba(255,120,180,.4); }
@keyframes orbit { from { transform: rotate(-90deg) scale(.3); opacity: 0; } 40% { opacity: 1; } to { transform: rotate(120deg) scale(1.4); opacity: 0; } }
.logo { overflow: visible; filter: drop-shadow(0 18px 40px rgba(255,80,160,.45)); animation: pop .5s .95s cubic-bezier(.3,1.6,.5,1) both; position: relative; z-index: 1; }
@keyframes pop { 50% { transform: scale(1.08); } }
.tile { fill: url(#g); fill-opacity: 0; stroke: #ff8cc0; stroke-width: 10; stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .8s .1s cubic-bezier(.6,0,.2,1) forwards, fill .35s .8s ease forwards; }
.ring { fill: none; stroke: #fff; stroke-width: 26; stroke-dasharray: 1; stroke-dashoffset: 1; stroke-linecap: round; animation: draw .6s .7s cubic-bezier(.6,0,.2,1) forwards; }
.dot { fill: #fff; transform-origin: 256px 256px; transform: scale(0); animation: dot .35s 1.15s cubic-bezier(.3,1.6,.5,1) forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes fill { to { fill-opacity: 1; stroke-opacity: 0; } }
@keyframes dot { to { transform: scale(1); } }
.word { display: flex; gap: 5px; font-weight: 800; font-size: 30px; letter-spacing: .08em; color: #fff; overflow: hidden; position: relative; z-index: 1; }
.word span { display: inline-block; animation: rise .5s cubic-bezier(.2,.8,.2,1) both; }
.word span.gap { width: 10px; }
@keyframes rise { from { transform: translateY(110%); opacity: 0; } }
.status { position: absolute; bottom: 42px; color: rgba(255,255,255,.45); font-size: 13px; font-weight: 800; letter-spacing: .04em; opacity: 0; animation: fadein .4s 1.7s forwards; }
@keyframes fadein { to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .grid, .orbit { display: none; } .logo, .tile, .ring, .dot, .word span { animation: none; fill-opacity: 1; stroke-dashoffset: 0; transform: none; } }
</style>
</head>
<body>
<div class="splash" id="s">
  <div class="grid"></div>
  <div class="orbit"><i></i><i></i><i></i></div>
  <svg class="logo" width="132" height="132" viewBox="0 0 512 512">
    <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff7ab6"/><stop offset="1" stop-color="#d6306f"/></linearGradient></defs>
    <g transform="rotate(-14 256 256)">
      <rect class="tile" x="56" y="56" width="400" height="400" rx="72" pathLength="1"/>
      <circle class="ring" cx="256" cy="256" r="118" pathLength="1"/>
      <circle class="dot" cx="256" cy="256" r="48"/>
    </g>
  </svg>
  <div class="word" id="w"></div>
  <div class="status" id="st">Démarrage de danser et de l’overlay…</div>
</div>
<script>
// Letters rise one by one, like the Romega launcher.
const w = document.getElementById('w');
[...'DANCING!'].forEach((c, i) => { const s = document.createElement('span'); if (c === ' ') s.className = 'gap'; else s.textContent = c; s.style.animationDelay = (1.25 + i * 0.06) + 's'; w.appendChild(s); });
// Short synthesized start-up chime (no audio file needed).
try {
  const ac = new AudioContext(), t = ac.currentTime + 0.95;
  [[523.25, 0], [783.99, .09], [1046.5, .18]].forEach(([f, d]) => { const o = ac.createOscillator(), g = ac.createGain(); o.type = 'sine'; o.frequency.value = f; g.gain.setValueAtTime(0, t + d); g.gain.linearRampToValueAtTime(.12, t + d + .02); g.gain.exponentialRampToValueAtTime(.0001, t + d + .9); o.connect(g).connect(ac.destination); o.start(t + d); o.stop(t + d + 1); });
} catch { }
// Leave once the animation has played AND the local server answers.
const URL_APP = 'http://127.0.0.1:24070/', t0 = performance.now();
async function ready() { try { await fetch(URL_APP + 'api/job', { mode: 'no-cors', cache: 'no-store' }); return true; } catch { return false; } }
(async function wait() {
  if (performance.now() - t0 > 2300 && await ready()) { document.getElementById('s').classList.add('out'); setTimeout(() => location.replace(URL_APP), 430); return; }
  if (performance.now() - t0 > 12000) document.getElementById('st').textContent = 'Le serveur met du temps à démarrer… (Node.js est-il installé ?)';
  setTimeout(wait, 150);
})();
</script>
</body>
</html>
